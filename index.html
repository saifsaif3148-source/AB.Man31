<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB MAN31 — Boutique Homme, Oran</title>
<meta name="description" content="AB MAN31 — vêtements et chaussures homme à Oran. Livraison dans les 58 wilayas, paiement à la livraison.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ==========================================================================
   AB MAN31 — design tokens
   Palette born from the shop's own paper price-tags & promo stickers:
   near-black shelving, cardboard/off-white ticket stock, marker-yellow ink,
   a stamp-red for promos, olive for the streetwear/cargo line.
   ========================================================================== */
:root{
  --ink:#0b0b0c;
  --ink-2:#141414;
  --ink-3:#1c1b19;
  --paper:#f3efe4;
  --paper-dim:#c9c4b4;
  --line:#332f28;
  --yellow:#f5b301;
  --yellow-2:#ffd23f;
  --stamp-red:#d6402c;
  --olive:#7a7657;
  --blue-tag:#3b6ea5;
  --radius:3px;

  --font-display:'Bebas Neue','Cairo',sans-serif;
  --font-body:'Space Grotesk','Cairo','Tajawal',sans-serif;
  --font-tag:'Space Mono','Tajawal',monospace;
}
[dir="rtl"]{
  --font-display:'Cairo',sans-serif;
  --font-body:'Tajawal','Cairo',sans-serif;
  --font-tag:'Tajawal',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--paper);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit;}
img{max-width:100%; display:block;}
.hidden{display:none !important;}
::selection{background:var(--yellow); color:var(--ink);}

/* subtle paper-grain / shelf-glow backdrop, fixed behind everything */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(700px 520px at 10% 8%, rgba(245,179,1,.14), transparent 60%),
    radial-gradient(620px 480px at 92% 6%, rgba(59,110,165,.12), transparent 60%),
    radial-gradient(680px 540px at 50% 100%, rgba(214,64,44,.10), transparent 60%),
    var(--ink);
  background-size:180% 180%;
  animation:driftBg 24s ease-in-out infinite alternate;
}
@keyframes driftBg{
  0%{background-position:0% 0%, 100% 0%, 50% 100%;}
  100%{background-position:14% 20%, 80% 16%, 46% 88%;}
}
@media (prefers-reduced-motion:reduce){body::before{animation:none;}}

.font-display{font-family:var(--font-display); text-transform:uppercase; letter-spacing:1px;}
.font-tag{font-family:var(--font-tag);}
.text-yellow{color:var(--yellow) !important;}
.bg-ink2{background:var(--ink-2) !important;}

/* focus visibility kept intentionally strong */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--yellow); outline-offset:2px;
}

/* ---------- signature: price-tag chip (used for badges, category pills) ---------- */
.tag-chip{
  position:relative; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-tag); font-size:11px; letter-spacing:.5px;
}
.tag-hole{width:6px; height:6px; border-radius:50%; background:var(--ink); border:1px solid rgba(0,0,0,.4);}

/* ---------- Navbar ---------- */
.site-navbar{
  position:fixed; top:0; inset-inline:0; z-index:1040;
  background:transparent; border-bottom:1px solid transparent;
  transition:background .35s ease, border-color .35s ease, padding .35s ease;
  padding:16px 0;
}
.site-navbar.scrolled{
  background:rgba(11,11,12,.94); backdrop-filter:blur(10px);
  border-bottom-color:var(--line); padding:9px 0;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.brand-mark{
  font-family:var(--font-display); font-size:26px; letter-spacing:2px; color:var(--paper);
  display:flex; align-items:center; gap:2px; cursor:pointer;
}
.brand-mark .dot{color:var(--yellow);}
.nav-icon-btn{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; border:1px solid var(--line); border-radius:50%;
  color:var(--paper); background:rgba(255,255,255,.03); transition:border-color .2s, color .2s;
}
.nav-icon-btn:hover{border-color:var(--yellow); color:var(--yellow);}
.cart-count{
  position:absolute; top:-6px; inset-inline-end:-6px; background:var(--stamp-red); color:#fff;
  font-family:var(--font-tag); font-size:10px; font-weight:700; border-radius:50%;
  width:18px; height:18px; display:flex; align-items:center; justify-content:center; border:2px solid var(--ink);
}
.lang-pill{
  border:1px solid var(--yellow); background:var(--yellow); color:var(--ink); border-radius:20px; padding:7px 26px;
  font-family:var(--font-tag); font-size:11px; font-weight:700; letter-spacing:1px;
  transition:background .2s, color .2s, border-color .2s;
}
.lang-pill:hover{background:var(--yellow-2); border-color:var(--yellow-2); color:var(--ink);}
.navbar-search{position:relative; max-width:340px; width:100%;}
.navbar-search input{
  width:100%; padding:9px 38px 9px 14px; border:1px solid var(--line); border-radius:20px;
  background:rgba(255,255,255,.05); color:var(--paper); font-size:13.5px; font-family:var(--font-body);
}
.navbar-search input::placeholder{color:var(--paper-dim);}
.navbar-search input:focus{outline:none; border-color:var(--yellow); background:rgba(255,255,255,.08);}
[dir="rtl"] .navbar-search input{padding:9px 14px 9px 38px;}
.navbar-search svg{position:absolute; inset-inline-end:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.6;}

.category-strip{
  border-top:1px solid var(--line); background:rgba(11,11,12,.9); backdrop-filter:blur(10px);
  overflow-x:auto; white-space:nowrap; scrollbar-width:none;
}
.category-strip::-webkit-scrollbar{display:none;}
.category-strip .inner{display:flex; gap:8px; padding:10px 0; max-width:1280px; margin:0 auto; padding-inline:16px;}
.cat-pill{
  font-family:var(--font-tag); font-size:11px; letter-spacing:.8px; text-transform:uppercase;
  padding:7px 14px; border:1px dashed var(--line); border-radius:20px; color:var(--paper-dim);
  white-space:nowrap; transition:border-color .2s, color .2s, background .2s;
}
.cat-pill.active, .cat-pill:hover{border-color:var(--yellow); color:var(--ink); background:var(--yellow); border-style:solid; font-weight:700;}

/* ---------- Hero ---------- */
.hero{
  position:relative; min-height:86vh; display:flex; align-items:center;
  padding:140px 0 70px; overflow:hidden;
}
.hero .grid-overlay{
  position:absolute; inset:0; z-index:0; opacity:.5; pointer-events:none;
  background-image:
    linear-gradient(rgba(243,239,228,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(243,239,228,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
}
.hero-eyebrow{
  font-family:var(--font-tag); font-size:12px; letter-spacing:4px; text-transform:uppercase;
  color:var(--yellow); display:flex; align-items:center; gap:10px; margin-bottom:20px;
}
.hero-eyebrow::before{content:""; width:34px; height:1px; background:var(--yellow);}
.hero h1{
  font-family:var(--font-display); font-weight:400; line-height:.95;
  font-size:clamp(48px,9vw,112px); letter-spacing:1px; color:var(--paper); margin:0;
}
.hero h1 .stroke{-webkit-text-stroke:1.5px var(--paper); color:transparent;}
.hero p{margin-top:20px; max-width:520px; font-size:16px; color:var(--paper-dim); line-height:1.7;}
.hero-badges{display:flex; gap:10px; flex-wrap:wrap; margin-top:32px;}
.hero-badges .tag-chip{
  border:1px dashed var(--line); padding:9px 14px 9px 10px; border-radius:20px; background:rgba(255,255,255,.03); color:var(--paper);
}
.hero-badges .tag-chip:nth-child(1){border-color:rgba(245,179,1,.5);}
.hero-badges .tag-chip:nth-child(2){border-color:rgba(59,110,165,.5);}
.hero-badges .tag-chip:nth-child(3){border-color:rgba(214,64,44,.5);}
.hero-cta{margin-top:34px; display:flex; gap:14px; flex-wrap:wrap;}
.btn-stamp{
  font-family:var(--font-tag); font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  padding:14px 26px; border-radius:2px; background:var(--yellow); color:var(--ink); display:inline-block;
  transition:transform .2s ease, background .2s ease;
}
.btn-stamp:hover{background:var(--yellow-2); transform:translateY(-2px); color:var(--ink);}
.btn-outline-stamp{
  font-family:var(--font-tag); font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  padding:14px 26px; border-radius:2px; border:1px solid var(--paper); color:var(--paper); display:inline-block;
  transition:transform .2s ease, border-color .2s;
}
.btn-outline-stamp:hover{border-color:var(--yellow); color:var(--yellow); transform:translateY(-2px);}
.scroll-cue{
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:1;
  color:var(--paper-dim); font-size:22px; animation:bob 2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,8px);}}
@media (prefers-reduced-motion:reduce){.scroll-cue{animation:none;}}

/* ---------- Ticker ---------- */
.ticker-strip{
  background:var(--yellow); color:var(--ink); overflow:hidden; white-space:nowrap; padding:11px 0;
  font-family:var(--font-tag); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  border-block:2px solid var(--ink);
  transform:rotate(-0.6deg); margin-block:6px;
}
.ticker-track{display:inline-block; animation:scrollTicker 26s linear infinite;}
.ticker-track span{margin-inline:22px;}
.ticker-track span::before{content:"✂"; margin-inline-end:22px;}
@keyframes scrollTicker{from{transform:translateX(0);} to{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;}}

/* ---------- Section title ---------- */
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:52px 0 22px; flex-wrap:wrap; gap:8px;}
.section-head h2{font-family:var(--font-display); font-size:30px; letter-spacing:1px; margin:0; color:var(--paper);}
.section-head .count-tag{font-family:var(--font-tag); font-size:12px; color:var(--paper-dim);}

/* ---------- Product card (styled like a hung price-tag / shoebox label) ---------- */
.product-card{
  background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  height:100%; display:flex; flex-direction:column; cursor:pointer; position:relative;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .3s ease;
}
.product-card:hover, .product-card:focus-within{
  transform:translateY(-6px) rotate(-.4deg);
  border-color:rgba(245,179,1,.5);
  box-shadow:0 18px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(245,179,1,.06);
}
.product-card .thumb{aspect-ratio:3/4; overflow:hidden; background:#101010; position:relative;}
.product-card .thumb img{width:100%; height:100%; object-fit:cover; filter:grayscale(100%) brightness(.9); transition:filter .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);}
.product-card:hover .thumb img, .product-card:focus-within .thumb img{filter:grayscale(0%) brightness(1); transform:scale(1.05);}
.promo-sticker{
  position:absolute; top:10px; inset-inline-start:-6px; background:var(--stamp-red); color:#fff;
  font-family:var(--font-tag); font-size:10.5px; font-weight:700; letter-spacing:1px;
  padding:5px 12px 5px 16px; transform:rotate(-6deg); box-shadow:0 3px 8px rgba(0,0,0,.4); z-index:2;
}
.promo-sticker::after{
  content:""; position:absolute; inset-inline-start:0; top:100%; border-inline-start:6px solid transparent;
  border-top:6px solid #7d251a;
}
.product-card .info{padding:14px; display:flex; flex-direction:column; gap:6px; flex:1; border-top:1px dashed var(--line);}
.product-card .cat{font-family:var(--font-tag); font-size:10px; color:var(--paper-dim); text-transform:uppercase; letter-spacing:1.2px;}
.product-card .name{font-size:14.5px; font-weight:600; line-height:1.35; color:var(--paper); font-family:var(--font-body);}
.price-row{display:flex; align-items:baseline; gap:8px; margin-top:auto;}
.price-now{font-family:var(--font-tag); font-weight:700; font-size:16px; color:var(--yellow);}
.price-old{font-family:var(--font-tag); font-size:12px; color:var(--paper-dim); text-decoration:line-through;}
.quick-add{
  margin-top:10px; background:var(--paper); color:var(--ink); padding:9px; text-align:center;
  font-family:var(--font-tag); font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
  border-radius:2px; opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease, background .2s ease;
}
.product-card:hover .quick-add, .product-card:focus-within .quick-add{opacity:1; transform:translateY(0);}
.quick-add:hover{background:var(--yellow);}
.quick-add.disabled{background:var(--paper-dim); color:#333; pointer-events:none;}
.empty-note{padding:36px 0; color:var(--paper-dim); font-size:14px; text-align:center; font-family:var(--font-tag);}

/* ---------- Bootstrap component overrides (dark, tag-styled) ---------- */
.modal-content, .offcanvas{
  background:var(--ink-2); color:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
}
.offcanvas{border-radius:0;}
.btn-close{filter:invert(1) grayscale(1) brightness(1.6);}
.modal-header, .offcanvas-header{border-color:var(--line);}
.modal-body h2, #productDetail h2{font-family:var(--font-display); letter-spacing:.5px;}
.size-chip{
  border:1.5px solid var(--line); padding:9px 15px; border-radius:2px; font-family:var(--font-tag); font-size:13px; font-weight:700;
  color:var(--paper); transition:border-color .2s ease, background .2s ease; cursor:pointer;
}
.size-chip.selected{background:var(--yellow); color:var(--ink); border-color:var(--yellow);}
.size-chip.disabled{border-color:var(--line); color:var(--paper-dim); text-decoration:line-through; cursor:not-allowed; opacity:.5;}
.qty-stepper{display:flex; align-items:center; gap:12px;}
.qty-stepper button{
  width:32px; height:32px; border:1.5px solid var(--line); color:var(--paper); border-radius:2px; font-size:16px; font-weight:700; background:transparent;
}
.qty-stepper button:disabled{opacity:.4; cursor:not-allowed;}
.qty-stepper span{font-family:var(--font-tag); font-size:15px; font-weight:700; min-width:16px; text-align:center;}
.cart-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line);}
.cart-item img{width:60px; height:76px; object-fit:cover; border-radius:2px; background:var(--ink-3);}
.form-control, .form-select{
  background:var(--ink-3); border:1px solid var(--line); color:var(--paper); border-radius:2px;
}
.form-control:focus, .form-select:focus{background:var(--ink-3); color:var(--paper); border-color:var(--yellow); box-shadow:0 0 0 .2rem rgba(245,179,1,.18);}
.form-control::placeholder{color:var(--paper-dim);}
.success-box{background:rgba(122,118,87,.15); border:1px solid var(--olive); color:#cdd3a8; padding:16px; border-radius:2px; font-size:13.5px; text-align:center; line-height:1.7;}

/* ---------- Footer ---------- */
.site-footer{background:var(--ink-2); border-top:1px solid var(--line); padding:56px 0 20px; margin-top:30px;}
.site-footer h4{font-family:var(--font-display); font-size:16px; letter-spacing:1px; color:var(--paper); margin-bottom:14px;}
.site-footer p, .site-footer a{font-size:13.5px; color:var(--paper-dim); display:block; margin-bottom:9px; line-height:1.6;}
.site-footer a:hover{color:var(--yellow);}
.footer-map{
  width:100%; aspect-ratio:4/3; border:1px solid var(--line); border-radius:2px; filter:grayscale(.5) invert(.92) contrast(.9);
}
.footer-bottom{border-top:1px solid var(--line); margin-top:36px; padding-top:18px; font-size:11.5px; color:var(--paper-dim); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.admin-link{cursor:pointer;}
.admin-link:hover{color:var(--yellow);}
.social-row{display:flex; gap:10px; margin-top:10px;}
.social-chip{
  display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:20px; padding:7px 12px;
  font-family:var(--font-tag); font-size:12px; color:var(--paper);
}
.social-chip svg{width:15px; height:15px;}
.social-chip:hover{border-color:var(--yellow); color:var(--yellow);}

/* ---------- Floating WhatsApp / Instagram ---------- */
.float-actions{position:fixed; inset-inline-end:20px; bottom:22px; z-index:1030; display:flex; flex-direction:column; gap:12px; align-items:flex-end;}
.float-btn{
  width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.5); color:#fff; transition:transform .25s ease;
}
.float-btn svg{width:25px; height:25px;}
.float-btn:hover{transform:translateY(-3px) scale(1.06);}
.float-btn.whatsapp{background:#25D366;}
.float-btn.instagram{background:radial-gradient(circle at 30% 110%, #ffdb73 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%);}
@media (max-width:640px){.float-actions{inset-inline-end:14px; bottom:16px; gap:10px;} .float-btn{width:46px; height:46px;} .float-btn svg{width:21px; height:21px;}}

/* ---------- Admin ---------- */
#admin-view{min-height:100vh; background:var(--ink);}
.admin-topbar{
  background:var(--ink-2); padding:14px 0; position:sticky; top:0; z-index:1020; border-bottom:1px solid var(--line);
}
.admin-back{font-family:var(--font-tag); font-size:12.5px; border:1px solid var(--line); padding:8px 16px; border-radius:20px; color:var(--paper);}
.admin-back:hover{border-color:var(--yellow); color:var(--yellow);}
.admin-tabs .nav-link{
  font-family:var(--font-tag); font-size:12.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:var(--paper-dim); border:1px solid var(--line); border-radius:20px; padding:9px 18px; margin-inline-end:8px; margin-bottom:8px;
}
.admin-tabs .nav-link.active{background:var(--yellow); color:var(--ink); border-color:var(--yellow);}
.stat-card{background:var(--ink-2); border:1px solid var(--line); border-radius:2px; padding:18px 20px;}
.stat-card .num{font-family:var(--font-display); font-size:30px; color:var(--yellow); letter-spacing:.5px;}
.stat-card .label{font-family:var(--font-tag); font-size:11.5px; color:var(--paper-dim); margin-top:4px;}
.admin-panel{background:var(--ink-2); border:1px solid var(--line); border-radius:2px; padding:20px; margin-bottom:20px;}
.admin-panel h3{font-family:var(--font-display); font-size:19px; letter-spacing:.5px; margin-bottom:14px;}
.table{color:var(--paper); font-size:13px; vertical-align:middle;}
.table>:not(caption)>*>*{background:transparent; border-color:var(--line); color:var(--paper);}
.table thead th{color:var(--paper-dim); font-family:var(--font-tag); font-weight:700; font-size:11px; text-transform:uppercase; border-bottom-color:var(--line);}
.status-select{font-family:var(--font-tag); font-size:12px;}
.badge-status{padding:4px 10px; border-radius:20px; font-family:var(--font-tag); font-size:10.5px; font-weight:700; display:inline-block; text-transform:uppercase;}
.badge-status.new{background:#1a2c52; color:#7fb0ff;}
.badge-status.confirmed{background:#4a3a12; color:#ffcf6b;}
.badge-status.shipping{background:#3a2c52; color:#c9a6ff;}
.badge-status.delivered{background:#173a1f; color:#7fe08a;}
.badge-status.returned{background:#4a1c1c; color:#ff8f8f;}
.small-btn{font-family:var(--font-tag); font-size:11.5px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); font-weight:700; color:var(--paper); background:transparent;}
.small-btn:hover{border-color:var(--yellow); color:var(--yellow);}
.small-btn.danger{color:#ff8f8f; border-color:#4a2222;}
.small-btn.danger:hover{border-color:var(--stamp-red); color:var(--stamp-red);}
.field-row{margin-bottom:14px;}
.field-row label{font-family:var(--font-tag); font-size:11.5px; font-weight:700; color:var(--paper-dim); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px;}
.stock-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.stock-row span{font-family:var(--font-tag); font-size:12.5px; width:24px; font-weight:700;}
.stock-row input{width:72px;}
.wilaya-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.wilaya-row input{width:100px; text-align:center;}
.empty-admin{color:var(--paper-dim); font-size:13px; padding:24px 0; text-align:center; font-family:var(--font-tag);}
.pin-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); padding:20px;}
.pin-box{background:var(--ink-2); border:1px solid var(--line); border-radius:2px; padding:34px 28px; width:100%; max-width:320px; text-align:center;}
.pin-box h2{font-family:var(--font-display); font-size:20px; margin-bottom:18px; letter-spacing:.5px;}
.pin-box input{width:100%; padding:13px; text-align:center; letter-spacing:6px; margin-bottom:14px; font-family:var(--font-tag); font-size:18px;}
.pin-error{color:var(--stamp-red); font-size:12px; margin-bottom:10px; min-height:14px; font-family:var(--font-tag);}
.toast-fixed{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink-2); color:var(--paper); border:1px solid var(--line); padding:12px 24px; border-radius:30px; font-size:13px; z-index:2000; box-shadow:0 4px 20px rgba(0,0,0,.5); max-width:88vw; text-align:center;}
.image-upload-box{
  width:150px; height:190px; border:1.5px dashed var(--line); border-radius:2px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; overflow:hidden; background:var(--ink-3); text-align:center;
}
.image-upload-box:hover{border-color:var(--yellow);}
.image-upload-box img{width:100%; height:100%; object-fit:cover;}
.image-upload-box .placeholder-text{font-size:11px; color:var(--paper-dim); padding:10px; line-height:1.5; font-family:var(--font-tag);}
.remove-photo-btn{font-size:12px; color:var(--stamp-red); font-weight:700; margin-top:8px; display:inline-block; cursor:pointer; font-family:var(--font-tag);}
.prod-thumb{width:36px; height:46px; object-fit:cover; border-radius:2px; background:var(--ink-3); vertical-align:middle; margin-inline-end:8px;}
.print-orders-btn{background:var(--ink-3); color:var(--paper); border:1px solid var(--line); padding:9px 16px; border-radius:20px; font-family:var(--font-tag); font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
.print-orders-btn:hover{border-color:var(--yellow); color:var(--yellow);}
@media print{
  body *{visibility:hidden;}
  #tab-orders, #tab-orders *{visibility:visible;}
  #tab-orders{position:absolute; inset-inline-start:0; top:0; width:100%; color:#000; background:#fff;}
  #tab-orders table{color:#000;}
  #tab-orders .no-print{display:none !important;}
}
</style>

function productToRow(p){
  return {
    id: p.id, category_key: p.categoryKey, price: p.price, old_price: p.oldPrice ?? null,
    stock: p.stock, name: p.name, description: p.description, image: p.image ?? null
  };
}
function rowToProduct(r){
  return {
    id: r.id, categoryKey: r.category_key, price: r.price, oldPrice: r.old_price,
    stock: r.stock, name: r.name, description: r.description, image: r.image
  };
}
function orderToRow(o){
  return {
    id: o.id, customer_name: o.customer_name, phone_number: o.phone_number, wilaya_code: o.wilaya_code,
    commune: o.commune, items: o.items, shipping_price: o.shipping_price, total_amount: o.total_amount,
    status: o.status, created_at: o.created_at
  };
}
function rowToOrder(r){
  return {
    id: r.id, customer_name: r.customer_name, phone_number: r.phone_number, wilaya_code: r.wilaya_code,
    commune: r.commune, items: r.items, shipping_price: r.shipping_price, total_amount: r.total_amount,
    status: r.status, created_at: r.created_at
  };
}

async function loadAll(){
  if(!supabaseClient){
    showToast("Configure SUPABASE_URL / SUPABASE_ANON_KEY dans le code");
    products = DEFAULT_PRODUCTS.slice();
    shipping = Object.fromEntries(WILAYAS.map(w=>[w[0], w[3]]));
    renderAll();
    return;
  }

  try{
    const { data, error } = await supabaseClient.from("products").select("*").order("id");
    if(error) throw error;
    products = (data && data.length) ? data.map(rowToProduct) : [];
    if(products.length===0){ products = DEFAULT_PRODUCTS.slice(); await saveProducts(); }
  }catch(e){ console.error(e); products = DEFAULT_PRODUCTS.slice(); showToast(t("toastStorageError")); }

  try{
    const { data, error } = await supabaseClient.from("orders").select("*").order("created_at", {ascending:false});
    if(error) throw error;
    orders = data ? data.map(rowToOrder) : [];
  }catch(e){ console.error(e); orders = []; showToast(t("toastStorageError")); }

  try{
    const { data, error } = await supabaseClient.from("shipping").select("*");
    if(error) throw error;
    shipping = (data && data.length)
      ? Object.fromEntries(data.map(r=>[r.wilaya_code, r.price]))
      : Object.fromEntries(WILAYAS.map(w=>[w[0], w[3]]));
    if(!data || data.length===0) await saveShipping();
  }catch(e){ console.error(e); shipping = Object.fromEntries(WILAYAS.map(w=>[w[0], w[3]])); showToast(t("toastStorageError")); }

  renderAll();
}

/* Remplace intégralement le contenu de chaque table par l'état JS courant.
   Simple et fiable pour un catalogue de taille boutique ; suffisant ici. */
async function saveProducts(){
  if(!supabaseClient) return;
  try{
    const { error: delErr } = await supabaseClient.from("products").delete().neq("id", "__none__");
    if(delErr) throw delErr;
    if(products.length){
      const { error: insErr } = await supabaseClient.from("products").insert(products.map(productToRow));
      if(insErr) throw insErr;
    }
  }catch(e){ console.error(e); showToast(t("toastStorageError")); }
}
async function saveOrders(){
  if(!supabaseClient) return;
  try{
    const { error: delErr } = await supabaseClient.from("orders").delete().neq("id", "__none__");
    if(delErr) throw delErr;
    if(orders.length){
      const { error: insErr } = await supabaseClient.from("orders").insert(orders.map(orderToRow));
      if(insErr) throw insErr;
    }
  }catch(e){ console.error(e); showToast(t("toastStorageError")); }
}
async function saveShipping(){
  if(!supabaseClient) return;
  try{
    const rows = Object.entries(shipping).map(([wilaya_code, price])=>({wilaya_code, price}));
    const { error: delErr } = await supabaseClient.from("shipping").delete().neq("wilaya_code", "__none__");
    if(delErr) throw delErr;
    if(rows.length){
      const { error: insErr } = await supabaseClient.from("shipping").insert(rows);
      if(insErr) throw insErr;
    }
  }catch(e){ console.error(e); showToast(t("toastStorageError")); }
}

  document.getElementById("gridCount").textContent = list.length + " " + t("productsSuffix");

    grid.innerHTML = `<div class="col-12"><div class="empty-note">${t("noProductsFound")}</div></div>`;
    return;
  }
  grid.innerHTML = list.map((p,i)=>{

    return `

            ${p.oldPrice ? `<div class="price-old">${p.oldPrice.toLocaleString()} DA</div>` : ""}
          </div>
          <div class="quick-add quick-add-btn ${totalStock<=0?'disabled':''}" data-product-id="${p.id}">
            ${totalStock>0 ? t("addToCart") : t("outOfStock")}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  
  // Attach event listeners to quick-add buttons
  setTimeout(()=>{
    document.querySelectorAll('.quick-add-btn').forEach(btn=>{
      btn.removeEventListener('click', handleQuickAdd);
      btn.addEventListener('click', handleQuickAdd);
    });
  }, 0);
}

function handleQuickAdd(e){
  e.preventDefault();
  e.stopPropagation();
  const productId = this.getAttribute('data-product-id');
  quickAdd(productId);
}

function quickAdd(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const available = SIZES.filter(s=>(p.stock[s]||0)>0);
  if(available.length===0){ showToast(t("toastOutOfStock")); return; }
  if(available.length===1){ addToCart(id, available[0], 1); showToast(t("toastAddedToCart")); }
  else{ openProduct(id); }
}

function selectSize(s){ selectedSize = s; selectedQty = 1; renderModal(); }
function changeModalQty(delta){

  const maxQty = p.stock[selectedSize]||0;
  selectedQty = Math.min(maxQty, Math.max(1, selectedQty+delta));
  renderModal();
}
function confirmAddToCart(){
  if(!selectedSize) return;
  addToCart(currentProduct.id, selectedSize, selectedQty);
  showToast(t("toastAddedToCart"));
  closeModal();
}

/* ================= CART ================= */
function cartItemId(productId, size){ return productId + "__" + size; }

function addToCart(productId, size, qty){
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  const stockAvail = p.stock[size] || 0;
  const cid = cartItemId(productId, size);
  const existing = cart.find(c=>c.cartId===cid);
  const currentQty = existing ? existing.qty : 0;
  const newQty = Math.min(stockAvail, currentQty + qty);
  if(newQty<=0){ showToast(t("toastOutOfStock")); return; }
  if(existing){ existing.qty = newQty; } else{ cart.push({cartId:cid, productId, size, qty:newQty}); }
  renderCartBadge();
}

function renderCartBadge(){
  const count = cart.reduce((s,c)=>s+c.qty, 0);
  const badge = document.getElementById("cartCount");
  if(count>0){ badge.textContent = count; badge.classList.remove("hidden"); }
  else{ badge.classList.add("hidden"); }
}

function openCart(){
  renderCartDrawer();
  try{
    if(!cartOffcanvasInstance) cartOffcanvasInstance = new bootstrap.Offcanvas(document.getElementById("cartOffcanvas"));
    cartOffcanvasInstance.show();
  }catch(e){ console.error("Bootstrap Offcanvas error:", e); }
}
function closeCart(){ try{ if(cartOffcanvasInstance) cartOffcanvasInstance.hide(); }catch(e){ } }

function cartLines(){
  return cart.map(c=>{ const p = products.find(x=>x.id===c.productId); return p ? {...c, product:p} : null; }).filter(Boolean);
}

function renderCartDrawer(){
  const lines = cartLines();
  const subtotal = lines.reduce((s,l)=>s + l.product.price*l.qty, 0);
  const shipPrice = cartWilaya ? (shipping[cartWilaya] ?? 0) : 0;
  const total = subtotal + shipPrice;

  let itemsHtml = "";
  if(lines.length===0){
    itemsHtml = `<div class="empty-note">${t("cartEmpty")}</div>`;
  }else{
    itemsHtml = lines.map((l,i)=>`
      <div class="cart-item">
        <img src="${getImage(l.product, i)}" alt="${getName(l.product)}">
        <div class="flex-fill d-flex flex-column gap-1">

          <div class="font-tag" style="font-size:11.5px; color:var(--paper-dim);">${t("chooseSize")}: ${l.size}</div>
          <div class="d-flex align-items-center justify-content-between mt-auto">
            <div class="qty-stepper">
              <button onclick="changeCartQty('${l.cartId}',-1)">−</button>
              <span>${l.qty}</span>
              <button onclick="changeCartQty('${l.cartId}',1)" ${l.qty>=l.product.stock[l.size]?'disabled':''}>+</button>
            </div>
            <div class="price-now" style="font-size:13.5px;">${(l.product.price*l.qty).toLocaleString()} DA</div>
          </div>
        </div>
        <div role="button" style="color:var(--stamp-red); font-weight:700;" onclick="removeCartItem('${l.cartId}')">✕</div>
      </div>
    `).join("");
  }

  const canOrder = lines.length>0;

  document.getElementById("cartOffcanvasContent").innerHTML = `
    <div class="offcanvas-header">
      <h2 class="offcanvas-title" style="font-size:20px;">${t("cartTitle")}</h2>
      <button type="button" class="btn-close" onclick="closeCart()"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div>${itemsHtml}</div>
      ${canOrder ? `
      <hr style="border-color:var(--line);">
      <form class="d-flex flex-column gap-2" id="cartOrderForm" onsubmit="submitCartOrder(event)">
        <h3 class="font-tag" style="font-size:14px; font-weight:700;">${t("fullName")} / ${t("phone")}</h3>
        <input class="form-control" id="ordName" type="text" placeholder="${t('fullName')}" required>
        <input class="form-control" id="ordPhone" type="tel" placeholder="${t('phone')}" required pattern="0[0-9]{9}">
        <select class="form-select" id="ordWilaya" required onchange="onCartWilayaChange(this.value)">
          <option value="" disabled ${!cartWilaya?'selected':''}>${t('chooseWilaya')}</option>
          ${WILAYAS.map(w=>`<option value="${w[0]}" ${cartWilaya===w[0]?'selected':''}>${w[0]} - ${wilayaName(w[0])}</option>`).join("")}
        </select>
        <input class="form-control" id="ordCommune" type="text" placeholder="${t('commune')}" required>
        <div class="d-flex justify-content-between font-tag" style="font-size:12.5px; color:var(--paper-dim); padding-top:6px;"><span>${t('subtotal')}</span><span>${subtotal.toLocaleString()} DA</span></div>
        <div class="d-flex justify-content-between font-tag" style="font-size:12.5px; color:var(--paper-dim);"><span>${t('shippingLabel')}</span><span>${cartWilaya ? shipPrice.toLocaleString()+' DA' : '—'}</span></div>
        <div class="d-flex justify-content-between font-tag fw-bold" style="font-size:15px; border-top:1px dashed var(--line); padding-top:10px;"><span>${t('total')}</span><span class="text-yellow">${cartWilaya ? total.toLocaleString()+' DA' : '—'}</span></div>
        <button type="submit" class="btn-stamp w-100 mt-2">${t('confirmOrder')}</button>
        <div class="font-tag" style="font-size:11px; color:var(--paper-dim);">${t('codNote')}</div>
      </form>
      ` : ""}
      <div id="cartOrderSuccess"></div>
    </div>
  `;
}

function onCartWilayaChange(code){ cartWilaya = code; renderCartDrawer(); }

function changeCartQty(cartId, delta){
  const line = cart.find(c=>c.cartId===cartId);
  if(!line) return;
  const p = products.find(x=>x.id===line.productId);
  const maxQty = p ? (p.stock[line.size]||0) : 0;
  line.qty = Math.min(maxQty, Math.max(1, line.qty+delta));
  renderCartDrawer();
  renderCartBadge();
}
function removeCartItem(cartId){
  cart = cart.filter(c=>c.cartId!==cartId);
  renderCartDrawer();
  renderCartBadge();
}

async function submitCartOrder(e){
  e.preventDefault();
  const lines = cartLines();
  if(lines.length===0) return;
  const wilCode = document.getElementById("ordWilaya").value;
  if(!wilCode) return;
  const shipPrice = shipping[wilCode] ?? 0;
  const subtotal = lines.reduce((s,l)=>s + l.product.price*l.qty, 0);

  const order = {
    id: "ord_" + Date.now(),
    customer_name: document.getElementById("ordName").value.trim(),
    phone_number: document.getElementById("ordPhone").value.trim(),
    wilaya_code: wilCode,
    commune: document.getElementById("ordCommune").value.trim(),
    items: lines.map(l=>({product_id:l.productId, name:getName(l.product), size:l.size, qty:l.qty, price:l.product.price})),
    shipping_price: shipPrice,
    total_amount: subtotal + shipPrice,
    status: "new",
    created_at: new Date().toISOString()
  };
  orders.unshift(order);

  lines.forEach(l=>{
    const idx = products.findIndex(x=>x.id===l.productId);
    if(idx>-1 && products[idx].stock[l.size]>0){
      products[idx].stock[l.size] = Math.max(0, products[idx].stock[l.size]-l.qty);
    }
  });

  await saveOrders();
  await saveProducts();
  const phoneVal = order.phone_number;
  cart = [];
  cartWilaya = "";
  renderCartBadge();

  document.getElementById("cartOffcanvasContent").innerHTML = `
    <div class="offcanvas-header">
      <h2 class="offcanvas-title" style="font-size:20px;">${t("cartTitle")}</h2>
      <button type="button" class="btn-close" onclick="closeCart()"></button>
    </div>
    <div class="offcanvas-body">
      <div class="success-box">
        ✅ ${t("orderSuccess")}<br>
        ${t("orderSuccessBody")} <strong>${phoneVal}</strong> ${t("orderSuccessSoon")}<br>
        ${t("orderNumber")}: ${order.id.slice(-6)}
      </div>
      <button class="btn-outline-stamp w-100 mt-3" onclick="closeCart()">${t("continueShopping")}</button>
    </div>
  `;
  renderGrid();
  showToast(t("toastOrderSaved"));
}

              <td><img class="prod-thumb" src="${getImage(p, idx)}" alt=""> ${getName(p)}</td>
              <td>${catLabel(p.categoryKey)}</td>
              <td>${p.price.toLocaleString()} DA</td>
              <td>${p.oldPrice ? p.oldPrice.toLocaleString()+' DA' : '—'}</td>
              <td>${total}</td>
              <td class="d-flex gap-2">
                <button class="small-btn" onclick="openProductForm('${p.id}')">${t('editBtn')}</button>
                <button class="small-btn danger" onclick="deleteProduct('${p.id}')">${t('deleteBtn')}</button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
    </div>
  `;
}

  const editing = id ? products.find(p=>p.id===id) : null;
  const p = editing || {name:"", categoryKey:CATEGORIES[0].key, price:"", oldPrice:"", description:"", stock:{S:0,M:0,L:0,XL:0}};
  const nameVal = editing ? getName(editing) : "";
  const descVal = editing ? getDesc(editing) : "";
  window.__pfImageData = editing && editing.image ? editing.image : null;
  const hasImg = !!window.__pfImageData;
  document.getElementById("productFormPanel").innerHTML = `
    <div class="admin-panel">
      <h3>${editing ? t('formTitleEdit') : t('formTitleNew')}</h3>
      <div class="field-row">
        <label>${t('labelPhoto')}</label>
        <div class="image-upload-box" onclick="document.getElementById('pf_image_input').click()">
          <img id="pf_image_preview" src="${hasImg?window.__pfImageData:''}" class="${hasImg?'':'hidden'}" alt="">
          <div id="pf_image_placeholder" class="placeholder-text ${hasImg?'hidden':''}">📷<br>${t('uploadPrompt')}</div>
        </div>
        <input type="file" id="pf_image_input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <span class="remove-photo-btn ${hasImg?'':'hidden'}" id="pf_remove_photo" onclick="removePfImage()">${t('removePhoto')}</span>
      </div>
      <div class="field-row"><label>${t('labelName')}</label><input class="form-control" id="pf_name" value="${nameVal.replace(/"/g,'&quot;')}"></div>
      <div class="row g-3">
        <div class="col-md-6 field-row"><label>${t('labelCategory')}</label>
          <select class="form-select" id="pf_category">${CATEGORIES.map(c=>`<option value="${c.key}" ${c.key===p.categoryKey?'selected':''}>${catLabel(c.key)}</option>`).join("")}</select>
        </div>
        <div class="col-md-6 field-row"><label>${t('labelDescription')}</label><input class="form-control" id="pf_desc" value="${descVal.replace(/"/g,'&quot;')}"></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6 field-row"><label>${t('labelPrice')}</label><input class="form-control" id="pf_price" type="number" value="${p.price}"></div>
        <div class="col-md-6 field-row"><label>${t('labelOldPrice')}</label><input class="form-control" id="pf_oldprice" type="number" value="${p.oldPrice||''}"></div>
      </div>
      <div class="field-row">
        <label>${t('labelStock')}</label>
        <div class="d-flex gap-3 flex-wrap">
          ${SIZES.map(s=>`<div class="stock-row"><span>${s}</span><input class="form-control" id="pf_stock_${s}" type="number" min="0" value="${p.stock[s]||0}"></div>`).join("")}
        </div>
      </div>
      <div class="d-flex gap-2 mt-2">
        <button class="btn-stamp" onclick="saveProductForm('${editing?editing.id:''}')">${editing ? t('saveEditBtn') : t('saveBtn')}</button>
        <button class="small-btn" onclick="document.getElementById('productFormPanel').innerHTML=''">${t('cancelBtn')}</button>
      </div>
    </div>
  `;
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageFile(file);
    window.__pfImageData = dataUrl;
    const preview = document.getElementById("pf_image_preview");
    preview.src = dataUrl;
    preview.classList.remove("hidden");
    document.getElementById("pf_image_placeholder").classList.add("hidden");
    document.getElementById("pf_remove_photo").classList.remove("hidden");
  }catch(e){ showToast(t("toastStorageError")); }
}
function removePfImage(){
  window.__pfImageData = null;
  const preview = document.getElementById("pf_image_preview");
  preview.src = "";
  preview.classList.add("hidden");
  document.getElementById("pf_image_placeholder").classList.remove("hidden");
  document.getElementById("pf_remove_photo").classList.add("hidden");
  const input = document.getElementById("pf_image_input");
  if(input) input.value = "";
}

async function saveProductForm(id){
  const name = document.getElementById("pf_name").value.trim();
  const categoryKey = document.getElementById("pf_category").value;
  const description = document.getElementById("pf_desc").value.trim();
  const price = parseFloat(document.getElementById("pf_price").value) || 0;
  const oldPriceRaw = document.getElementById("pf_oldprice").value;
  const oldPrice = oldPriceRaw ? parseFloat(oldPriceRaw) : null;
  const stock = {};
  SIZES.forEach(s => stock[s] = parseInt(document.getElementById("pf_stock_"+s).value) || 0);

  if(!name || !price){ showToast(t("fillNamePrice")); return; }
  const image = window.__pfImageData || null;

  if(id){
    const idx = products.findIndex(p=>p.id===id);
    products[idx] = {...products[idx], name, description, categoryKey, price, oldPrice, stock, image};
  }else{
    products.push({id:"p_"+Date.now(), name, description, categoryKey, price, oldPrice, stock, image});
  }
  await saveProducts();
  showToast(t("toastProductSaved"));
  renderProductsTab();
}

async function deleteProduct(id){
  if(!confirm(t("deleteConfirm"))) return;
  products = products.filter(p=>p.id!==id);
  await saveProducts();
  showToast(t("toastProductDeleted"));
  renderProductsTab();
}

function filterWilayaList(q){
  q = q.trim().toLowerCase();
  const list = WILAYAS.filter(w => !q || wilayaName(w[0]).toLowerCase().includes(q) || w[0].includes(q));
  document.getElementById("wilayaList").innerHTML = list.map(w=>`
    <div class="wilaya-row">
      <span>${w[0]} - ${wilayaName(w[0])}</span>
      <input class="form-control" type="number" value="${shipping[w[0]] ?? w[3]}" onchange="updateShippingPrice('${w[0]}', this.value)">
    </div>
  `).join("");
}
async function updateShippingPrice(code, value){
  shipping[code] = parseInt(value) || 0;
  await saveShipping();
  showToast(t("toastShippingUpdated"));
}
